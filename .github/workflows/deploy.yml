name: Build and deploy darkesthj.com

on:
  push:
    branches: [main]
  schedule:
    # Reconstruye Health cada 15 min para refrescar sus datos de Notion,
    # a la par que el sync de Finance. El commit de docs/ no-opea si nada
    # cambió, así que solo publica cuando hay datos nuevos.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: monitor_src/health_app/package-lock.json

      - name: Install Health deps
        working-directory: monitor_src/health_app
        run: npm ci

      - name: Build Health (static export)
        working-directory: monitor_src/health_app
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID_HEALTH }}
          # Mismo secret que Finance: si está definido, los datos de Health se
          # publican cifrados y el panel pide la passphrase para desbloquearse.
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          NEXT_BASE_PATH: /monitor/health
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Freeze Flask app
        run: python freeze.py

      - name: Copy Health build into docs/monitor/health
        run: |
          mkdir -p docs/monitor/health
          cp -r monitor_src/health_app/out/. docs/monitor/health/

      - name: Commit docs/ if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          # --cached detecta archivos nuevos (untracked) ademas de modificados.
          if git diff --cached --quiet -- docs; then
            echo "Sin cambios en docs/"
            exit 0
          fi
          git commit -m "chore: rebuild site ($(date -u +%Y-%m-%dT%H:%MZ))"
          # Otro workflow (sync-finance, cron) puede pushear a main mientras
          # corremos. Intentamos push directo; si lo rechazan, rebase con
          # --autostash (npm install ensucia package-lock.json en el árbol)
          # y reintentamos.
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rechazado, reintento $i..."
            git pull --rebase --autostash origin main || true
            sleep $((2 ** i))
          done
          echo "No se pudo pushear docs/ tras varios intentos" >&2
          exit 1

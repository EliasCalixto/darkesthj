<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monitor — Finance y Health</title>
    <link rel="canonical" href="{{ site_origin }}{{ request.path }}" />
    <meta name="description" content="Dashboards personales de finanzas y salud de darkesthj, sincronizados con Notion." />
    <meta name="theme-color" content="#0c1324" />
    <link rel="icon" type="image/png" href="{{ favicon_path }}" />
    <link rel="apple-touch-icon" href="{{ favicon_path }}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ site_name }}" />
    <meta property="og:title" content="Monitor — Finance y Health" />
    <meta property="og:description" content="Dashboards personales de finanzas y salud de darkesthj, sincronizados con Notion." />
    <meta property="og:url" content="{{ site_origin }}{{ request.path }}" />
    <meta property="og:image" content="{{ social_image }}" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Monitor — Finance y Health" />
    <meta name="twitter:description" content="Dashboards personales de finanzas y salud de darkesthj, sincronizados con Notion." />
    <meta name="twitter:image" content="{{ social_image }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body class="page-monitor">
    <header class="mon-topbar">
      <img src="{{ url_for('static', filename='assets/monitor-logo.svg') }}" alt="Logo Monitor" class="mon-logo" width="56" height="56" />
      <div>
        <span class="mon-brand-name">Monitor</span>
        <span class="mon-brand-tag">Dashboards personales</span>
      </div>
    </header>

    <main class="mon-main" role="main">
      <div class="mon-grid">
        <a class="mon-card" href="/monitor/finance/">
          <span class="mon-card-eyebrow">Finance</span>
          <h2>Finance</h2>
          <p>Gastos, ingresos y resumen mensual, con gráficos por categoría.</p>
        </a>
        <a class="mon-card" href="/monitor/health/">
          <span class="mon-card-eyebrow">Health</span>
          <h2>Health</h2>
          <p>Sueño, entrenamientos, alimentación y resumen mensual de Apple Health.</p>
        </a>
      </div>
    </main>
  </body>
</html>
